<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Syllogism Validity Demo</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#1b2233;--muted:#667085;--line:#dde2ee;--blue:#1f4e9c;--gold:#f2b700;--ok:#1a7f4b;--bad:#c0392b;--okbg:#e6f5ec;--badbg:#fbeaea}
@media(prefers-color-scheme:dark){:root{--bg:#10141f;--card:#182033;--text:#e8ecf6;--muted:#9aa5bd;--line:#2a3550;--blue:#6ea0ff;--ok:#4cd08a;--bad:#ff7a6b;--okbg:#12301f;--badbg:#3a1a1a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:17px/1.5 system-ui,Segoe UI,sans-serif}
header{background:var(--blue);color:#fff;padding:18px 20px;border-bottom:4px solid var(--gold)}
header h1{margin:0;font-size:21px}header p{margin:2px 0 0;font-size:14px;opacity:.9}
main{max-width:820px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.muted{color:var(--muted);font-size:15px}
textarea{width:100%;min-height:110px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit;resize:vertical}
button{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:11px 18px;font:inherit;font-weight:600;cursor:pointer}
button.chip{background:transparent;color:var(--blue);border:1px solid var(--line);font-weight:500;padding:6px 11px;font-size:15px}
button:disabled{opacity:.5}.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.res{margin-top:14px;padding:14px;border-radius:10px;border:1px solid var(--line)}
.res.valid{background:var(--okbg);border-color:var(--ok)}.res.invalid{background:var(--badbg);border-color:var(--bad)}
.big{font-size:26px;font-weight:700}.valid .big{color:var(--ok)}.invalid .big{color:var(--bad)}
.bar{height:8px;background:var(--line);border-radius:4px;margin:6px 0;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue)}
</style></head><body>
<header><h1>Does the conclusion follow? Logic over plausibility</h1><p>Fine-tuned language model for syllogism validity &middot; Yash, A2305224323</p></header>
<main><section class="card">
<p class="muted">Type two premises and a conclusion. The model judges whether the conclusion logically follows, even if the content sounds silly.</p>
<textarea id="text">All planets are dogs. All dogs are animals. Therefore, all planets are animals.</textarea>
<div class="row" id="chips"></div>
<button id="go">Check validity</button><div id="out1"></div>
</section></main>
<script>
const $=id=>document.getElementById(id);
const post=(u,b)=>fetch(u,{method:'POST',body:JSON.stringify(b)}).then(r=>r.json());
const EX=[["Silly but valid","All planets are dogs. All dogs are animals. Therefore, all planets are animals."],
["Everyday valid","All dogs are animals. All animals breathe. Therefore, all dogs breathe."],
["Sounds right, but invalid","All cars are a type of vehicle. No animal is a car. Therefore, no animal can be a vehicle."],
["Another invalid","Some cats are pets. Some pets are dogs. Therefore, some cats are dogs."]];
EX.forEach(([n,t])=>{const b=document.createElement('button');b.className='chip';b.textContent=n;b.onclick=()=>{$('text').value=t;run()};$('chips').append(b)});
function verdictHtml(r){const p=r.p_valid*100;return `<div class="res ${r.valid?'valid':'invalid'}"><div class="big">${r.valid?'VALID':'INVALID'}</div>
<div class="muted">${r.valid?'The conclusion follows from the premises.':'The conclusion does not follow from the premises.'}</div>
<div class="bar"><i style="width:${p}%"></i></div><div class="muted">Model confidence that it is valid: ${p.toFixed(1)}%</div></div>`}
async function run(){const parts=$('text').value.split(/[.!?]+/).filter(s=>s.trim().length>2);
if(parts.length<3){$('out1').innerHTML='<div class="res"><b>Incomplete syllogism.</b><div class="muted">It needs two premises and a conclusion, e.g. "All dogs are animals. All animals breathe. Therefore, all dogs breathe."</div></div>';return}
$('go').disabled=true;const r=await post('/api/predict',{text:$('text').value});$('go').disabled=false;$('out1').innerHTML=r.error?`<div class="res">${r.error}</div>`:verdictHtml(r)}
$('go').onclick=run;
</script></body></html>
